[project]
name = "simulation-server"
version = "0.1.0"
description = "HTTP job API for running COMSOL simulations (SPR-PCF mode analysis) via mph"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mph = ["mph"]
api = ["fastapi", "uvicorn[standard]"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
